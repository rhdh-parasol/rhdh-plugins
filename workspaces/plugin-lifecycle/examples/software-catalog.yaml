# Software Catalog identity fixtures for the example app.
#
# These are deliberately limited to Components. Extension Plugin and Package
# entities are supplied by the real Extensions backend in app-config.live.yaml
# from the overlays checkout; they are not duplicated in this file.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: red-hat-developer-hub-global-header
  namespace: default
  title: Global Header
  description: Global Header source workspace
spec:
  type: backstage-plugin
  lifecycle: active
  owner: rhdh-team

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: overlay-global-header
  namespace: default
  title: Overlay workspace global-header
  description: Packaging and publication workspace for Global Header.
  annotations:
    github.com/project-slug: rhdh-parasol/rhdh-plugin-export-overlays
    rhdh.io/overlay-workspace: global-header
    rhdh.io/source-repository: https://github.com/rhdh-parasol/rhdh-plugins
    rhdh.io/source-revision: aabb85ef001ddae5af621ecf17e02f7bac9175e3
    rhdh.io/source-entity-ref: component:default/red-hat-developer-hub-global-header
    rhdh.io/extensions-plugin-refs: plugin:rhdh/global-header
    rhdh.io/extensions-package-refs: package:rhdh/red-hat-developer-hub-backstage-plugin-global-header
spec:
  type: rhdh-overlay-workspace
  lifecycle: experimental
  owner: rhdh-team
  dependsOn:
    - component:default/red-hat-developer-hub-global-header

