# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
# The reusable workflow overlays upstream defaults onto the standard layered
# directories before every run. Keep repo-owned agents under rhdh/ so their
# harnesses and resources remain intact.
agents:
    - name: code
      source: rhdh/harness/code.yaml
      model: claude-opus-4-6
    - name: fix
      source: rhdh/harness/fix.yaml
      model: claude-opus-4-6
    - name: dependabot-risk-rater
      source: rhdh/harness/dependabot-risk-rater.yaml
      model: claude-opus-4-6
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
    - https://github.com/redhat-developer/rhdh-skill/
    - https://github.com/christoph-jerolimov/dependency-update-risk-rating/
create_issues:
    allow_targets:
        repos:
            - rhdh-parasol/rhdh-plugins
            - fullsend-ai/fullsend
mint_url: https://mint.fullsend.sh
inference:
    project: rhdh-sidekick-167988
    wif_provider: projects/189673402608/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-rhdh-parasol-rhdh-plugins
