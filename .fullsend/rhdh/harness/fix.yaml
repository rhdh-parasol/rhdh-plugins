# Pinned to agents@v0.43.0 (commit 7ab05564b), matching the fullsend@v0.43.0
# CLI our own .github/workflows/fullsend.yaml pins — these are companion
# releases cut together, so this is the harness content the installed CLI
# was actually built and tested against.
base: https://raw.githubusercontent.com/fullsend-ai/agents/7ab05564b3c9c0ab20197e0c8572b5905ffd75ca/harness/fix.yaml#sha256=a9429da216d4d3b82dd94f8225776e7a9581c2d3eeccd02829f94c74c7e70aee
agent: rhdh/agents/fix.md
# policy: inherited from base (policies/base.yaml + openshell providers/
# profiles for vertex-ai, package-registries, gitleaks and, via the github
# forge overlay, github-code). Our former rhdh/policies/code.yaml fork
# existed only to allowlist the claude.exe binary for Vertex;
# profiles/fullsend-vertex-ai.yaml now does that upstream (ADR 0065's
# provider/profile network policy migration).
skills:
  - https://github.com/redhat-developer/rhdh-skill/tree/e84109919ae6085e3dcfe568c695e6dda54874ce/skills/rhdh-coding#sha256=5a4bc35476108a215091ccf1180cee68547c7668c6b193de4402674bc7b6cded
  - https://github.com/JessicaJHee/rhdh-skills/tree/567202c2c725b72729e76b44d5df1e51a7250a18/skills/security/rhdh-package-impact#sha256=f08d5e32f4293a37a1da3294fbb735da544b812a806338611997a41bc08d8f86
# Harness-level allowlist required for URL skills (not inherited from base or
# config.yaml). Must also be covered by config.yaml allowed_remote_resources.
allowed_remote_resources:
  - https://github.com/redhat-developer/rhdh-skill/
  - https://github.com/JessicaJHee/rhdh-skills/
host_files:
  - src: rhdh/bin/yarn
    dest: /sandbox/workspace/bin/yarn
  - src: rhdh/env/yarn-proxy.env
    dest: /sandbox/workspace/.env.d/yarn-proxy.env
# Merged with base env maps (child keys win). GH_TOKEN is already injected by
# upstream env. GITHUB_REPOSITORY lets plugins-package-impact scripts resolve
# the Dependabot API target without git.
env:
  sandbox:
    GITHUB_REPOSITORY: "${REPO_FULL_NAME}"
