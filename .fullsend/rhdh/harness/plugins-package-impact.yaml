# Standalone custom agent: plugins-package-impact on /fullsend-package-impact.
# Classify Dependabot/CVE impact for a workspace and comment. Does not bump,
# commit, or dismiss alerts — that stays /fs-code and humans.
#
# Reuses the code sandbox (yarn, node) and the review mint role so the
# post-script can comment. Does not inherit review/code pre/post scripts.
agent: rhdh/agents/plugins-package-impact.md
model: claude-opus-4-6
image: ghcr.io/fullsend-ai/fullsend-code:latest
policy: rhdh/policies/plugins-package-impact.yaml

role: review
slug: rhdh-plugins-package-impact

# Issue or same-repo PR comment. Skip fork PRs (empty head/base is fail-closed
# is_fork=true in fullsend — do not treat that as a fork).
trigger: >
  event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fullsend-package-impact"
    && event.entity.kind == "work_item"
    && event.actor.kind != "bot"
    && (!has(event.state.change_proposal)
        || event.state.change_proposal.head_repo == ""
        || event.state.change_proposal.head_repo == event.state.change_proposal.base_repo)

skills:
  - https://github.com/kim-tsao/rhdh-security-skills/tree/4e28c41e6bf87d1b31ffb04babb59003d062d7a1/skills/cve/plugins-package-impact#sha256=ce42ad55925c3fb1792405ab167b9e5df0f84334fafb12a691467bed15e3729a

# Harness-level allowlist required for URL skills (not inherited from
# config.yaml). Must also be covered by config.yaml allowed_remote_resources.
allowed_remote_resources:
  - https://github.com/kim-tsao/rhdh-security-skills/

host_files:
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true
  - src: rhdh/bin/yarn
    dest: /sandbox/workspace/bin/yarn
  - src: rhdh/env/yarn-proxy.env
    dest: /sandbox/workspace/.env.d/yarn-proxy.env
  - src: rhdh/env/node-proxy.env
    dest: /sandbox/workspace/.env.d/node-proxy.env
  - src: /tmp/workspace/package-impact-context.json
    dest: /sandbox/workspace/package-impact-context.json
    optional: true
  - src: /tmp/workspace/dependabot-alerts.json
    dest: /sandbox/workspace/dependabot-alerts.json
    optional: true

pre_script: rhdh/scripts/pre-plugins-package-impact.sh
post_script: rhdh/scripts/post-plugins-package-impact.sh

timeout_minutes: 30

overlays:
  - when: 'runtime.forge == "github"'
    env:
      runner:
        GH_TOKEN: "${GH_TOKEN}"
        REVIEW_TOKEN: "${REVIEW_TOKEN}"
        # Repo Actions secret with Dependabot alerts: read. Used only on
        # the runner to dump alerts; never mapped into the sandbox.
        DEPENDABOT_TOKEN: "${DEPENDABOT_TOKEN}"
        REPO_FULL_NAME: "${REPO_FULL_NAME}"
        ISSUE_NUMBER: "${ISSUE_NUMBER}"
        ISSUE_URL: "${GITHUB_ISSUE_URL}"
        GITHUB_ISSUE_URL: "${GITHUB_ISSUE_URL}"
        HUMAN_INSTRUCTION: "${HUMAN_INSTRUCTION}"
        FULLSEND_OUTPUT_FILE: agent-result.json
      sandbox:
        ISSUE_URL: "${GITHUB_ISSUE_URL}"
        REPO_FULL_NAME: "${REPO_FULL_NAME}"
        GITHUB_REPOSITORY: "${REPO_FULL_NAME}"
        WORKSPACE: "${PACKAGE_IMPACT_WORKSPACE}"
        HUMAN_INSTRUCTION: "${HUMAN_INSTRUCTION}"
        NODE_USE_ENV_PROXY: "1"
        FULLSEND_OUTPUT_FILE: agent-result.json
        CLAUDE_CODE_USE_VERTEX: "1"
        ANTHROPIC_VERTEX_PROJECT_ID: "${ANTHROPIC_VERTEX_PROJECT_ID}"
        CLOUD_ML_REGION: "${CLOUD_ML_REGION}"
        GOOGLE_APPLICATION_CREDENTIALS: /tmp/.gcp-credentials.json
        GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT}"
