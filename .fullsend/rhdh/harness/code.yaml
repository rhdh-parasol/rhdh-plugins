base: https://raw.githubusercontent.com/fullsend-ai/agents/ba1d46fb30329283a092fc30d53cf68e99e5ce86/harness/code.yaml#sha256=4f0d9425d5ee1fa86e21d3b6d1ac9bd086da2f59de9d80a311f753c00d99303d
agent: rhdh/agents/code.md
policy: rhdh/policies/code.yaml
skills:
  - https://github.com/redhat-developer/rhdh-skill/tree/e84109919ae6085e3dcfe568c695e6dda54874ce/skills/rhdh-coding#sha256=5a4bc35476108a215091ccf1180cee68547c7668c6b193de4402674bc7b6cded
  - https://github.com/kim-tsao/rhdh-security-skills/tree/6f28f949a73667cfc87d3eaf7f1c4edc961b3361/skills/cve/plugins-package-impact#sha256=a3bd41109800eaa78e52bc2fb0478f3079b871d0610b3c9e4d8d801ca2a14d32
# Harness-level allowlist required for URL skills (not inherited from base or
# config.yaml). Must also be covered by config.yaml allowed_remote_resources.
allowed_remote_resources:
  - https://github.com/redhat-developer/rhdh-skill/
  - https://github.com/kim-tsao/rhdh-security-skills/
host_files:
  - src: rhdh/bin/yarn
    dest: /sandbox/workspace/bin/yarn
  - src: rhdh/env/yarn-proxy.env
    dest: /sandbox/workspace/.env.d/yarn-proxy.env
# Merged with base env maps (child keys win). GH_TOKEN is already injected by
# upstream env/code.env (read-only coder app token). GITHUB_REPOSITORY lets
# plugins-package-impact scripts resolve the Dependabot API target without git.
env:
  runner:
    # Jira dispatch has a work-item key rather than a GitHub issue number.
    # Pin the only branch this automation may target.
    CODE_ALLOWED_TARGET_BRANCHES: "main"
  sandbox:
    GITHUB_REPOSITORY: "${REPO_FULL_NAME}"

# The Jira poller evaluates explicit harness triggers. GitHub /fs-code remains
# on Fullsend's built-in stage router.
trigger: >
  event.source.system == "jira"
    && event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-code"
    && event.entity.kind == "work_item"
